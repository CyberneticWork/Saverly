version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: pricewise-db
    environment:
      MYSQL_DATABASE: pricewise
      MYSQL_USER: pricewise
      MYSQL_PASSWORD: pricewise_secret
      MYSQL_ROOT_PASSWORD: pricewise_root_secret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - '3306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'pricewise', '-ppricewise_secret']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pricewise-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://pricewise:pricewise_secret@mysql:3306/pricewise
      JWT_SECRET: change_this_in_production_very_long_secret
      JWT_REFRESH_SECRET: change_this_refresh_secret_too
      PORT: 5000
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash-lite}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-45000}
    ports:
      - '5000:5000'
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: pricewise-admin
    depends_on:
      - backend
    ports:
      - '3001:80'
    restart: unless-stopped

volumes:
  mysql_data:
  uploads_data:
